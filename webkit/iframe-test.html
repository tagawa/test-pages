<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WebKit iFrame Test</title>

<style>
  body { font: 16px system-ui; margin: 20px; }
  pre { white-space: pre-wrap; background: #eee; padding: 12px; }
  #frames iframe { width: 1px; height: 1px; border: 0; }
</style>

<h1>WebKit iFrame Test</h1>
<p>
  On every load, this page creates 400 about:blank iframes in a short burst,
  as some ad, video and carousel scripts do. It starts again after an
  unexpected reload.
</p>

<pre id="status"></pre>
<div id="frames"></div>

<hr>

<figure>
  <img src="iframe-test.gif" alt="" style="height:148px; width:148px; max-width:100%;">
  <figcaption>QR code for this page.</figcaption>
</figure>

<script>
const KEY = "webkit-iframe-test";
const prior = JSON.parse(localStorage.getItem(KEY) || "null");

const count = 400;
const interval = 20;

let state = prior || {};
let timer;
let alive = 0;

const status = document.querySelector("#status");
const frames = document.querySelector("#frames");

const suspectedTermination =
    prior?.running === true && prior?.cleanShutdown === false;

function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
}

function show(message = "") {
    status.textContent = [
        `UA: ${navigator.userAgent}`,
        `Previous abnormal termination: ${suspectedTermination}`,
        suspectedTermination
            ? `Previous run stopped at: ${prior.created || 0} frames`
            : "",
        `Run: ${state.run || 0}`,
        `Frames created: ${state.created || 0} / ${count}`,
        `Frames alive: ${alive}`,
        `Elapsed: ${state.started ? ((Date.now() - state.started) / 1000).toFixed(1) : 0} s`,
        message
    ].filter(Boolean).join("\n");
}

function start() {
    state = {
        run: (state.run || 0) + 1,
        created: 0,
        started: Date.now(),
        running: true,
        cleanShutdown: false
    };

    save();
    show("Running");
    timer = setInterval(step, interval);
}

function step() {
    const frame = document.createElement("iframe");
    frame.src = "about:blank";
    frames.appendChild(frame);
    alive++;

    state.created++;
    save();

    if (state.created >= count) {
        // Frames stay in the page, so the run counts as running until unload.
        clearInterval(timer);
        show("Done");
    } else {
        show("Running");
    }
}

function markCleanShutdown() {
    state.cleanShutdown = true;
    save();
}

// iOS may skip beforeunload, so also listen for pagehide.
addEventListener("beforeunload", markCleanShutdown);
addEventListener("pagehide", markCleanShutdown);

show(suspectedTermination
    ? "Previous run ended without beforeunload or pagehide"
    : "Ready");

setTimeout(start, 750);
</script>
